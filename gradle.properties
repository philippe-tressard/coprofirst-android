#
# Le POSTE est partagé (suites iOS, plusieurs worktrees Android) : deux workers au plus
# par build, et UN démon par jeu de réglages, réutilisé d'un worktree à l'autre — d'où
# aucun `--no-daemon` au poste (scripts, consignes). Il s'arrête après 15 min d'inactivité.
# La CI, seule sur son runner, relève la borne par `--max-workers` (ci.yml).
org.gradle.workers.max=2
org.gradle.daemon.idletimeout=900000
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
