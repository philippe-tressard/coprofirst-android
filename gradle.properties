# Le POSTE est partagé (suites iOS, plusieurs worktrees Android) : deux workers au plus
# par build, et UN démon par jeu de réglages, réutilisé d'un worktree à l'autre — d'où
# aucun `--no-daemon` au poste (scripts, consignes). Il s'arrête après 15 min d'inactivité.
# La CI, seule sur son runner, relève la borne par `--max-workers` (ci.yml).
org.gradle.workers.max=2
org.gradle.daemon.idletimeout=900000
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
# Réseau : une erreur transitoire (429 de Maven Central, 408, 5xx, coupure) se réessaie
# 6 fois, l'attente doublant depuis 2 s (2+4+8+16+32 = 62 s au plus). Gradle 9.9.1 en
# fait 3 depuis 1 s (NetworkOperationBackOffAndRetry) : 3 s ne passent pas un 429 (#232).
systemProp.org.gradle.internal.network.retry.max.attempts=6
systemProp.org.gradle.internal.network.retry.initial.backOff=2000
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# La base du nom de version (majeure.mineure) ; le correctif est le nombre de commits
# (build racine, build.gradle.kts). Elle ne change QUE sur une décision de sortie — jamais dans
# la PR d'un écran.
coprofirst.version.base=0.8
