version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      gradle:
        patterns: ["*"]
  - package-ecosystem: github-actions
    # L'action commune de la CI épingle ses propres actions (#232) : elle se suit aussi.
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
