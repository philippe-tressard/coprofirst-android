#
# CI : garde-fous du dépôt, REUSE et contrat ; build, lint Android strict et tests ;
# tests d'interface sur émulateur (job « Interface »).
# Actions épinglées par SHA de commit : une étiquette se déplace, un SHA non.
# Aucune signature ni secret Google en CI : l'app se signe au poste.
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  depot:
    name: Dépôt (500 lignes, encodage, modes, LICENSE, REUSE, contrat)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Garde-fous du dépôt
        run: bash scripts/verifier-depot.sh
      - name: Contrat identique à la release du plancher
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/importer-contrat.sh --verifier
      - name: Logo et sa licence identiques à coprofirst
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/importer-logo.sh --verifier
      - name: REUSE
        run: |
          python3 -m venv "$RUNNER_TEMP/reuse"
          "$RUNNER_TEMP/reuse/bin/pip" install --quiet --disable-pip-version-check "reuse[charset-normalizer]==6.2.0"
          "$RUNNER_TEMP/reuse/bin/reuse" lint
  build:
    name: Build, lint et tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Plateforme Android de compileSdk
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.2" > /dev/null
      - name: Build (debug et release non signée), lint strict, tests
        run: ./gradlew --no-daemon --max-workers=4 :app:assembleDebug :app:assembleRelease :app:lintDebug :app:testDebugUnitTest :client-api:test
  interface:
    name: Interface (émulateur)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Plateforme Android de compileSdk
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.2" > /dev/null
      - name: Accélération matérielle de l'émulateur (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Tests d'interface (parcours réel contre un serveur local en HTTPS)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew --no-daemon --max-workers=4 :app:connectedDebugAndroidTest
