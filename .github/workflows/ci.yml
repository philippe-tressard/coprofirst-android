#
# CI : garde-fous du dépôt, REUSE et contrat ; build, lint Android strict et tests ;
# tests d'interface sur émulateur (job « Interface »).
# Actions épinglées par SHA de commit : une étiquette se déplace, un SHA non.
# Aucune signature ni secret Google en CI : l'app se signe au poste.
# Chaque job finit par l'ALERTE (#345) : un rouge de main ouvre ou complète « CI rouge : CI »
# (scripts/signaler_ci.py) ; une PR, jamais — la garde du pas l'exclut, le script aussi.
# Chaque émulateur s'arrête en temps borné, kill forcé en repli (#315, scripts/arreter_emulateur.py).
# scripts/verifier_ci.py refuse un job sans l'un ou l'autre.
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  issues: write # pour l'alerte seule (scripts/signaler_ci.py), dont le pas ne joue jamais sur une PR
# L'architecture des émulateurs ; chaque job d'émulateur nomme son image (IMAGE_API,
# IMAGE_CIBLE), lue À LA FOIS par l'émulateur et par la préparation commune, qui la tient
# en cache et la télécharge avec un réessai borné (#232, scripts/verifier_ci.py).
env:
  IMAGE_ARCH: x86_64
# Une PR : sa nouvelle poussée annule l'exécution précédente (seule la dernière tête
# compte). main : CHAQUE commit est jugé, sans annulation — c'est le filet, car la
# protection exige les checks sans exiger d'être à jour (strict désactivé le 15/11 ; aucune
# file de fusion, #328) et un main rouge passe avant tout autre lot (standards/09 §8 bis).
# Un groupe par commit : GitHub ne garde qu'UNE exécution en attente par groupe, un groupe
# commun évincerait des fusions rapprochées. `scripts/verifier_ci.py` refuse `merge_group`.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  depot:
    name: Dépôt (500 lignes, encodage, modes, LICENSE, REUSE, contrat)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Garde-fous du dépôt
        run: bash scripts/verifier-depot.sh
      - name: Contrat identique à la release du plancher
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/importer-contrat.sh --verifier
      - name: Logo et sa licence identiques à coprofirst
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/importer-logo.sh --verifier
      - name: Contenu de la vitrine identique à coprofirst-site
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/importer-vitrine.sh --verifier
      - name: REUSE
        run: |
          python3 -m venv "$RUNNER_TEMP/reuse"
          "$RUNNER_TEMP/reuse/bin/pip" install --quiet --disable-pip-version-check -r scripts/requirements.txt
          "$RUNNER_TEMP/reuse/bin/reuse" lint
      - name: Alerte (un rouge de main ouvre ou complète un ticket, #345)
        if: ${{ (failure() || cancelled()) && github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I scripts/signaler_ci.py --signaler --etat "${{ job.status }}"
  build:
    name: Build, lint et tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tout l'historique et les étiquettes : la version se déduit de git (build racine).
          fetch-depth: 0
      - uses: ./.github/actions/preparer-android
      - name: Build (debug et release non signée), lint strict, tests — téléphone et montre (#207)
        run: ./gradlew --no-daemon --max-workers=4 :app:assembleDebug :app:assembleRelease :app:lintDebug :app:testDebugUnitTest :client-api:test :partage:test :partage-android:lintDebug :partage-android:testDebugUnitTest :montre:assembleDebug :montre:assembleRelease :montre:lintDebug :montre:testDebugUnitTest
      - name: Alerte (un rouge de main ouvre ou complète un ticket, #345)
        if: ${{ (failure() || cancelled()) && github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I scripts/signaler_ci.py --signaler --etat "${{ job.status }}"
  interface:
    name: Interface (émulateur)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE_API: 35
      IMAGE_CIBLE: google_apis
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tout l'historique et les étiquettes : la version se déduit de git (build racine).
          fetch-depth: 0
      - uses: ./.github/actions/preparer-android
        with:
          emulateur: oui
      - name: Tests d'interface (parcours réel contre un serveur local en HTTPS)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.IMAGE_API }}
          target: ${{ env.IMAGE_CIBLE }}
          arch: ${{ env.IMAGE_ARCH }}
          disable-animations: true
          script: python3 -I scripts/arreter_emulateur.py -- ./gradlew --no-daemon --max-workers=4 :app:connectedDebugAndroidTest
      - name: Rapport des tests d'interface (sur échec)
        # Le journal ne nomme pas le test en cause : le rapport le dit (#65).
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rapport-tests-interface
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Bilan des tests d'interface dans le résumé (échecs, les plus lents)
        # Vert comme rouge : les tests les plus lents, en regard du délai commun d'attente
        # (DELAI_GESTE_MS), mesurent si ce délai tient sur l'émulateur de la CI (#119).
        if: success() || failure()
        # Au résumé ET au journal : le résumé ne se lit que connecté à GitHub, le journal
        # se lit par `gh run view --log` (les sessions, la coordination).
        run: python3 -I scripts/bilan_tests_interface.py app/build/outputs/androidTest-results | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Alerte (un rouge de main ouvre ou complète un ticket, #345)
        if: ${{ (failure() || cancelled()) && github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I scripts/signaler_ci.py --signaler --etat "${{ job.status }}"

  interface-tablette:
    # Un ÉCHANTILLON sur tablette (pixel_tablet), comme l'échantillon iPad de l'iOS
    # (coprofirst-ios#220) : l'entrée, le fil, le profil. Job à part, pour que le check requis
    # « Interface (émulateur) » garde son nom (#69).
    name: Interface tablette (échantillon)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE_API: 35
      IMAGE_CIBLE: google_apis
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tout l'historique et les étiquettes : la version se déduit de git (build racine).
          fetch-depth: 0
      - uses: ./.github/actions/preparer-android
        with:
          emulateur: oui
      - name: Tests d'interface (parcours réel contre un serveur local en HTTPS)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.IMAGE_API }}
          target: ${{ env.IMAGE_CIBLE }}
          arch: ${{ env.IMAGE_ARCH }}
          profile: pixel_tablet
          disable-animations: true
          script: python3 -I scripts/arreter_emulateur.py -- ./gradlew --no-daemon --max-workers=4 :app:connectedDebugAndroidTest "-Pandroid.testInstrumentationRunnerArguments.class=fr.coprofirst.app.entree.ParcoursEntreeInterfaceTest,fr.coprofirst.app.fonctions.fil.FilInterfaceTest,fr.coprofirst.app.fonctions.profil.ProfilInterfaceTest"
      - name: Rapport des tests d'interface (sur échec)
        # Le journal ne nomme pas le test en cause : le rapport le dit (#65).
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rapport-tests-interface-tablette
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Bilan des tests d'interface dans le résumé (échecs, les plus lents)
        # Vert comme rouge : les tests les plus lents, en regard du délai commun d'attente
        # (DELAI_GESTE_MS), mesurent si ce délai tient sur l'émulateur de la CI (#119).
        if: success() || failure()
        # Au résumé ET au journal : le résumé ne se lit que connecté à GitHub, le journal
        # se lit par `gh run view --log` (les sessions, la coordination).
        run: python3 -I scripts/bilan_tests_interface.py app/build/outputs/androidTest-results | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Alerte (un rouge de main ouvre ou complète un ticket, #345)
        if: ${{ (failure() || cancelled()) && github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I scripts/signaler_ci.py --signaler --etat "${{ job.status }}"

  interface-montre:
    # La montre Wear OS (#207) sur SON émulateur (écran rond) : la cloche, « Déjà lues », le
    # détail, les états vides. Job à part : les checks requis du téléphone gardent leur nom.
    name: Interface montre (Wear OS)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE_API: 34
      IMAGE_CIBLE: android-wear
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tout l'historique et les étiquettes : la version se déduit de git (build racine).
          fetch-depth: 0
      - uses: ./.github/actions/preparer-android
        with:
          emulateur: oui
      - name: Tests d'interface de la montre
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.IMAGE_API }}
          target: ${{ env.IMAGE_CIBLE }}
          arch: ${{ env.IMAGE_ARCH }}
          profile: wearos_large_round
          disable-animations: true
          script: python3 -I scripts/arreter_emulateur.py -- ./gradlew --no-daemon --max-workers=4 :montre:connectedDebugAndroidTest
      - name: Aperçu de la tuile (rendu par le test, à versionner tel quel)
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apercu-tuile
          path: montre/build/outputs/connected_android_test_additional_output/
          retention-days: 7
          if-no-files-found: error
      - name: Rapport des tests d'interface de la montre (sur échec)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rapport-tests-interface-montre
          path: |
            montre/build/reports/androidTests/
            montre/build/outputs/androidTest-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Alerte (un rouge de main ouvre ou complète un ticket, #345)
        if: ${{ (failure() || cancelled()) && github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I scripts/signaler_ci.py --signaler --etat "${{ job.status }}"
