#
# CI : garde-fous du dépôt, REUSE et contrat ; build, lint Android strict et tests ;
# tests d'interface sur émulateur (job « Interface »).
# Actions épinglées par SHA de commit : une étiquette se déplace, un SHA non.
# Aucune signature ni secret Google en CI : l'app se signe au poste.
name: CI
on:
  push:
    branches: [main]
  pull_request:
  # La file de fusion : chaque PR est rejugée sur main + les PR devant elle, avant de
  # fusionner — main ne peut plus rougir par combinaison de deux PR vertes chacune.
  merge_group:
permissions:
  contents: read
# Une PR : sa nouvelle poussée annule l'exécution précédente (seule la dernière tête
# compte). main et la file de fusion (`merge_group`) : CHAQUE commit est jugé, sans
# annulation — un groupe par commit, car GitHub ne garde qu'UNE exécution en attente par
# groupe : un groupe commun évincerait les fusions ou les candidats rapprochés.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  depot:
    name: Dépôt (500 lignes, encodage, modes, LICENSE, REUSE, contrat)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Garde-fous du dépôt
        run: bash scripts/verifier-depot.sh
      - name: Contrat identique à la release du plancher
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/importer-contrat.sh --verifier
      - name: Logo et sa licence identiques à coprofirst
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/importer-logo.sh --verifier
      - name: Contenu de la vitrine identique à coprofirst-site
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/importer-vitrine.sh --verifier
      - name: REUSE
        run: |
          python3 -m venv "$RUNNER_TEMP/reuse"
          "$RUNNER_TEMP/reuse/bin/pip" install --quiet --disable-pip-version-check "reuse[charset-normalizer]==6.2.0"
          "$RUNNER_TEMP/reuse/bin/reuse" lint
  build:
    name: Build, lint et tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tout l'historique et les étiquettes : la version se déduit de git (app/build.gradle.kts).
          fetch-depth: 0
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Plateforme Android de compileSdk
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.2" > /dev/null
      - name: Build (debug et release non signée), lint strict, tests — téléphone et montre (#207)
        run: ./gradlew --no-daemon --max-workers=4 :app:assembleDebug :app:assembleRelease :app:lintDebug :app:testDebugUnitTest :client-api:test :partage:test :montre:assembleDebug :montre:assembleRelease :montre:lintDebug :montre:testDebugUnitTest
  interface:
    name: Interface (émulateur)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tout l'historique et les étiquettes : la version se déduit de git (app/build.gradle.kts).
          fetch-depth: 0
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Plateforme Android de compileSdk
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.2" > /dev/null
      - name: Accélération matérielle de l'émulateur (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Tests d'interface (parcours réel contre un serveur local en HTTPS)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew --no-daemon --max-workers=4 :app:connectedDebugAndroidTest
      - name: Rapport des tests d'interface (sur échec)
        # Le journal ne nomme pas le test en cause : le rapport le dit (#65).
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rapport-tests-interface
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Bilan des tests d'interface dans le résumé (échecs, les plus lents)
        # Vert comme rouge : les tests les plus lents, en regard du délai commun d'attente
        # (DELAI_GESTE_MS), mesurent si ce délai tient sur l'émulateur de la CI (#119).
        if: success() || failure()
        # Au résumé ET au journal : le résumé ne se lit que connecté à GitHub, le journal
        # se lit par `gh run view --log` (les sessions, la coordination).
        run: python3 -I scripts/bilan_tests_interface.py app/build/outputs/androidTest-results | tee -a "$GITHUB_STEP_SUMMARY"

  interface-tablette:
    # Un ÉCHANTILLON sur tablette (pixel_tablet), comme l'échantillon iPad de l'iOS
    # (coprofirst-ios#220) : l'entrée, le fil, le profil. Job à part, pour que le check requis
    # « Interface (émulateur) » garde son nom (#69).
    name: Interface tablette (échantillon)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tout l'historique et les étiquettes : la version se déduit de git (app/build.gradle.kts).
          fetch-depth: 0
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Plateforme Android de compileSdk
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.2" > /dev/null
      - name: Accélération matérielle de l'émulateur (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Tests d'interface (parcours réel contre un serveur local en HTTPS)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_tablet
          disable-animations: true
          script: ./gradlew --no-daemon --max-workers=4 :app:connectedDebugAndroidTest "-Pandroid.testInstrumentationRunnerArguments.class=fr.coprofirst.app.entree.ParcoursEntreeInterfaceTest,fr.coprofirst.app.fonctions.fil.FilInterfaceTest,fr.coprofirst.app.fonctions.profil.ProfilInterfaceTest"
      - name: Rapport des tests d'interface (sur échec)
        # Le journal ne nomme pas le test en cause : le rapport le dit (#65).
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rapport-tests-interface-tablette
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Bilan des tests d'interface dans le résumé (échecs, les plus lents)
        # Vert comme rouge : les tests les plus lents, en regard du délai commun d'attente
        # (DELAI_GESTE_MS), mesurent si ce délai tient sur l'émulateur de la CI (#119).
        if: success() || failure()
        # Au résumé ET au journal : le résumé ne se lit que connecté à GitHub, le journal
        # se lit par `gh run view --log` (les sessions, la coordination).
        run: python3 -I scripts/bilan_tests_interface.py app/build/outputs/androidTest-results | tee -a "$GITHUB_STEP_SUMMARY"
