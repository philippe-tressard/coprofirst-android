# SPDX-FileCopyrightText: 2026 Philippe TRESSARD
# SPDX-License-Identifier: AGPL-3.0-or-later WITH LicenseRef-CoproFirst-Magasins
#
# Conformité REUSE (standards/14 §6.2). Les fichiers qui portent leur en-tête SPDX
# n'ont rien à faire ici ; ne s'y déclarent que ceux qui ne le peuvent pas.
#
version = 1

# Le LOGO de CoproFirst : le dessin du site (front/static/favicon.svg de coprofirst),
# recopié À L'IDENTIQUE par scripts/importer-logo.sh, qui en tient l'identité en CI.
# Hors de l'AGPL et de la permission magasins : sa licence propre, qui couvre l'app
# Android publiée par son auteur (usage 5, coprofirst#2743, MARQUE.md). Son format
# d'Android est généré au build, sans en changer le dessin ni les couleurs.
[[annotations]]
path = "partage-android/src/main/logo/logo.svg"
precedence = "override"
SPDX-FileCopyrightText = "2026 Philippe TRESSARD"
SPDX-License-Identifier = "LicenseRef-CoproFirst-Logo"

# Le wrapper de Gradle : script et archive produits par `gradle wrapper`, sous la
# licence de Gradle (Apache-2.0), recopiés tels quels.
[[annotations]]
path = ["gradlew", "gradle/wrapper/gradle-wrapper.jar"]
precedence = "override"
SPDX-FileCopyrightText = "2015 the original authors of Gradle"
SPDX-License-Identifier = "Apache-2.0"

# Produit par `gradle wrapper` (sans commentaire conservé) ; le JSON n'admet pas de
# commentaire ; l'avis d'un composant tiers s'affiche tel quel dans « À propos » (#27).
[[annotations]]
path = ["gradle/wrapper/gradle-wrapper.properties", ".claude/settings.json", "app/src/main/tiers/composants.json", "app/src/main/tiers/avis-public-suffix-list.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Philippe TRESSARD"
SPDX-License-Identifier = "AGPL-3.0-or-later WITH LicenseRef-CoproFirst-Magasins"

# Le contrat de l'API, les tables et les constantes publiées pour les clients, joints par
# coprofirst (même auteur, seul titulaire des droits) à chaque release, recopiés à
# l'octet par scripts/importer-contrat.sh.
[[annotations]]
path = ["contrat/openapi.json", "contrat/au-dessus/openapi.json", "contrat/tables-clients.json", "contrat/constantes-clients.json"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Philippe TRESSARD"
SPDX-License-Identifier = "AGPL-3.0-or-later WITH LicenseRef-CoproFirst-Magasins"

# Les tracés des icônes du site (#183), joints à la release de coprofirst et recopiés à
# l'octet par scripts/importer-contrat.sh : Lucide (ISC ; MIT pour la part issue de
# Feather), le logo WhatsApp de Simple Icons (CC0-1.0), l'icône `stairs` du projet.
# La part AGPL (l'icône du projet) porte la permission magasins, comme les autres pièces de
# la même release : les tracés sont compilés dans l'app que les magasins distribuent (#337,
# décision prise le 23/11/2026 sous la délégation de Philippe au coordinateur).
[[annotations]]
path = "contrat/icones-svg.json"
precedence = "override"
SPDX-FileCopyrightText = [
  "2026 Philippe TRESSARD",
  "2026 Lucide Icons and Contributors",
  "2013-present Cole Bemis",
]
SPDX-License-Identifier = "AGPL-3.0-or-later WITH LicenseRef-CoproFirst-Magasins AND ISC AND MIT AND CC0-1.0"

# Le contenu de la vitrine (« En savoir plus », la démo) : site/contenu.json de
# coprofirst-site (même auteur, seul titulaire des droits), recopié à l'octet par
# scripts/importer-vitrine.sh. Le JSON n'admet pas d'en-tête.
[[annotations]]
path = "app/src/main/assets/vitrine/contenu.json"
precedence = "override"
SPDX-FileCopyrightText = "2026 Philippe TRESSARD"
SPDX-License-Identifier = "AGPL-3.0-or-later WITH LicenseRef-CoproFirst-Magasins"

# L'aperçu de la tuile de la montre (#207) : une capture de la tuile rendue par
# ApercuTuileTest sur l'émulateur Wear OS de la CI, versionnée telle quelle. Une image
# n'admet pas d'en-tête.
[[annotations]]
path = "montre/src/main/res/drawable-nodpi/apercu_tuile.png"
precedence = "override"
SPDX-FileCopyrightText = "2026 Philippe TRESSARD"
SPDX-License-Identifier = "AGPL-3.0-or-later WITH LicenseRef-CoproFirst-Magasins"

# Les notes de version, collées telles quelles dans la Play Console (500 caractères au
# plus, comptés par le contrôle avant soumission) : un en-tête y serait compté et publié.
[[annotations]]
path = "docs/play-store/notes/*.txt"
precedence = "override"
SPDX-FileCopyrightText = "2026 Philippe TRESSARD"
SPDX-License-Identifier = "AGPL-3.0-or-later WITH LicenseRef-CoproFirst-Magasins"
