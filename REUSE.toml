# SPDX-FileCopyrightText: 2026 Philippe TRESSARD
# SPDX-License-Identifier: AGPL-3.0-or-later WITH LicenseRef-CoproFirst-Magasins
#
# Conformité REUSE (standards/14 §6.2). Les fichiers qui portent leur en-tête SPDX
# n'ont rien à faire ici ; ne s'y déclarent que ceux qui ne le peuvent pas.
#
version = 1

# Le LOGO de CoproFirst : le dessin du site (front/static/favicon.svg de coprofirst),
# recopié À L'IDENTIQUE par scripts/importer-logo.sh, qui en tient l'identité en CI.
# Hors de l'AGPL et de la permission magasins : sa licence propre, qui couvre l'app
# Android publiée par son auteur (usage 5, coprofirst#2743, MARQUE.md). Son format
# d'Android est généré au build, sans en changer le dessin ni les couleurs.
[[annotations]]
path = "app/src/main/logo/logo.svg"
precedence = "override"
SPDX-FileCopyrightText = "2026 Philippe TRESSARD"
SPDX-License-Identifier = "LicenseRef-CoproFirst-Logo"

# Le wrapper de Gradle : script et archive produits par `gradle wrapper`, sous la
# licence de Gradle (Apache-2.0), recopiés tels quels.
[[annotations]]
path = ["gradlew", "gradle/wrapper/gradle-wrapper.jar"]
precedence = "override"
SPDX-FileCopyrightText = "2015 the original authors of Gradle"
SPDX-License-Identifier = "Apache-2.0"

# Produit par `gradle wrapper` (sans commentaire conservé) ; le JSON n'admet pas de
# commentaire ; l'avis d'un composant tiers s'affiche tel quel dans « À propos » (#27).
[[annotations]]
path = ["gradle/wrapper/gradle-wrapper.properties", ".claude/settings.json", "app/src/main/tiers/composants.json", "app/src/main/tiers/avis-public-suffix-list.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Philippe TRESSARD"
SPDX-License-Identifier = "AGPL-3.0-or-later WITH LicenseRef-CoproFirst-Magasins"

# Le contrat de l'API, les tables et les constantes publiées pour les clients, joints par
# coprofirst (même auteur, seul titulaire des droits) à chaque release, recopiés à
# l'octet par scripts/importer-contrat.sh.
[[annotations]]
path = ["contrat/openapi.json", "contrat/tables-clients.json", "contrat/constantes-clients.json"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Philippe TRESSARD"
SPDX-License-Identifier = "AGPL-3.0-or-later WITH LicenseRef-CoproFirst-Magasins"
